[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lore-memory"
version = "0.1.0"
description = "Biologically-inspired compounding agent memory engine — verified, consolidated, forgetting."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Abdul Rahman", email = "m21rahmankhan@gmail.com" }
]
keywords = ["ai", "agents", "memory", "context-engineering", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Phase 0: zero external dependencies. The harness, stats, protocols, and
# models all use stdlib only. LLM SDKs and embedding libraries arrive at
# Phase 1+ and live in optional dependency groups.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lore_memory"]
