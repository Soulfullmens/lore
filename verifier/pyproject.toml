[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lore-commons"
version = "0.2.0"
description = "A verified experience commons for AI agents — verification CLI and toolset."
readme = "../README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Abdul Rahman", email = "m21rahmankhan@gmail.com" }
]
keywords = ["ai", "agents", "mcp", "verification", "procedural-knowledge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.1.0",
    "jsonschema>=4.20.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
lore = "lore.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/lore"]
